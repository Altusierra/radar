<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR — Inteligencia de Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#07070d;--bg-surface:#0f0f18;--bg-card:#161622;--bg-card-hover:#1c1c2e;--bg-input:#12121e;--accent:#00e87b;--accent-dim:#00e87b22;--accent-mid:#00e87b55;--blue:#3b82f6;--blue-dim:#3b82f622;--amber:#f59e0b;--amber-dim:#f59e0b22;--red:#ef4444;--red-dim:#ef444422;--purple:#a855f7;--purple-dim:#a855f722;--pink:#ec4899;--pink-dim:#ec489922;--cyan:#06b6d4;--cyan-dim:#06b6d422;--text:#e4e4e7;--text-secondary:#a1a1aa;--text-muted:#52525b;--border:#27273a;--border-light:#1e1e2e;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-base);color:var(--text);font-family:var(--font);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg-base)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#0a1a12 0%,var(--bg-base) 70%)}
.login-box{text-align:center;max-width:420px;width:90%;padding:2.5rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:16px}
.login-logo{font-size:2.5rem;font-weight:700;letter-spacing:6px;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text-muted);margin-bottom:2rem;font-family:var(--mono)}
.login-input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;margin-bottom:12px;outline:none;transition:border .2s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#07070d;border:none;border-radius:8px;font-family:var(--font);font-weight:600;font-size:14px;cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-hint{font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.5}
.login-hint a{color:var(--accent);text-decoration:none}
.app{display:none;height:100vh}.app.active{display:flex}
.sidebar{width:230px;min-width:230px;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1rem 0;overflow-y:auto}
.sidebar-logo{font-size:1.3rem;font-weight:700;letter-spacing:4px;color:var(--accent);padding:0 1.25rem;margin-bottom:4px}
.sidebar-sub{font-size:10px;color:var(--text-muted);font-family:var(--mono);padding:0 1.25rem;margin-bottom:1.5rem}
.nav-group{margin-bottom:.8rem}.nav-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);padding:0 1.25rem;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:6px 1.25rem;cursor:pointer;font-size:12.5px;color:var(--text-secondary);transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg-card);color:var(--text)}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-dim)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.nav-badge{margin-left:auto;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:10px;background:var(--accent-dim);color:var(--accent)}
.sidebar-footer{margin-top:auto;padding:.8rem 1.25rem;border-top:1px solid var(--border)}
.sidebar-footer button{width:100%;padding:7px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:11px;cursor:pointer;font-family:var(--font);transition:all .15s}
.sidebar-footer button:hover{border-color:var(--red);color:var(--red)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg-surface)}
.topbar-title{font-size:16px;font-weight:600}
.topbar-date{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-date input{padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;color-scheme:dark}
.topbar-refresh{padding:6px 14px;background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:6px;color:var(--accent);font-size:12px;cursor:pointer;font-family:var(--mono);font-weight:500;transition:all .15s}
.topbar-refresh:hover{background:var(--accent);color:var(--bg-base)}
.topbar-filter{padding:6px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.topbar-filter.active{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.cards-grid{display:flex;flex-direction:column;gap:12px}
.news-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;padding:16px 20px;transition:all .2s;cursor:default;position:relative}
.news-card:hover{border-color:var(--border);background:var(--bg-card-hover)}
.news-card.read{opacity:.55}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card-badge{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px;font-weight:500}
.badge-critical{background:var(--red-dim);color:var(--red)}.badge-informative{background:var(--blue-dim);color:var(--blue)}.badge-opportunity{background:var(--accent-dim);color:var(--accent)}.badge-threat{background:var(--amber-dim);color:var(--amber)}
.card-source{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.card-date{font-size:11px;color:var(--text-muted);margin-left:auto;font-family:var(--mono)}
.card-title{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:6px;color:var(--text)}
.card-summary{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}
.card-btn{padding:5px 12px;font-size:11px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-secondary);font-family:var(--font);transition:all .15s}
.card-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-btn.favorited{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.card-btn.link-btn{border-color:var(--blue);color:var(--blue);text-decoration:none;display:inline-flex}
.card-btn.link-btn:hover{background:var(--blue-dim)}
.card-btn.impact-btn{border-color:var(--purple);color:var(--purple)}
.card-btn.impact-btn:hover{background:var(--purple-dim)}
.card-note{margin-top:10px;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;display:none}
.card-note.open{display:block}
.card-note textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:12px;font-family:var(--font);resize:vertical;min-height:50px;outline:none}
.card-note .note-save{margin-top:6px;padding:4px 10px;background:var(--accent);color:var(--bg-base);border:none;border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--font);font-weight:500}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;padding:24px}
.modal-title{font-size:16px;font-weight:600;color:var(--purple);margin-bottom:4px}
.modal-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.modal-content{font-size:13px;color:var(--text-secondary);line-height:1.7}
.modal-close{margin-top:16px;padding:8px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);cursor:pointer;font-family:var(--font);font-size:13px}
.loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0}
.radar-spinner{width:60px;height:60px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text-muted);font-family:var(--mono)}
.loading-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.digest-box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;padding:20px;margin-bottom:16px}
.digest-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
.digest-content{font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
.digest-copy{margin-top:12px;padding:6px 14px;background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:6px;color:var(--accent);font-size:12px;cursor:pointer;font-family:var(--mono)}
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:500;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--text-muted);max-width:400px;margin:0 auto;line-height:1.6}
.settings-section{margin-bottom:24px}
.settings-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--accent)}
.settings-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.settings-row input[type="text"]{flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.welcome-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;text-align:center}
.welcome-card:hover{border-color:var(--accent);background:var(--bg-card-hover)}
.welcome-card-icon{font-size:28px;margin-bottom:8px}
.welcome-card-title{font-size:13px;font-weight:500;color:var(--text)}
.welcome-card-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
@media(max-width:768px){.sidebar{display:none}.app{flex-direction:column}.mobile-nav{display:flex !important;overflow-x:auto;background:var(--bg-surface);border-bottom:1px solid var(--border);padding:8px 12px;gap:6px}.mobile-nav-btn{white-space:nowrap;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;color:var(--text-secondary);font-size:11px;cursor:pointer;font-family:var(--font)}.mobile-nav-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}.topbar{flex-wrap:wrap;padding:10px 16px}.content{padding:12px 16px}}
.mobile-nav{display:none}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--bg-base);border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(0,232,123,0.4);z-index:90;transition:transform .2s}
.fab:hover{transform:scale(1.05)}
.fab-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.fab-modal.open{display:flex}
.fab-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;max-width:700px;width:90%;max-height:85vh;overflow-y:auto;padding:24px}
.fab-title{font-size:18px;font-weight:600;color:var(--accent);margin-bottom:4px}
.fab-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.fab-textarea{width:100%;min-height:140px;padding:12px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;resize:vertical;margin-bottom:12px}
.fab-textarea:focus{border-color:var(--accent)}
.fab-file{display:block;padding:10px;background:var(--bg-input);border:1px dashed var(--border);border-radius:8px;color:var(--text-secondary);font-size:12px;margin-bottom:12px;cursor:pointer;text-align:center}
.fab-file:hover{border-color:var(--accent);color:var(--accent)}
.fab-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fab-action-btn{padding:8px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.fab-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.fab-action-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.fab-submit{padding:10px 20px;background:var(--accent);color:var(--bg-base);border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--font)}
.fab-submit:disabled{opacity:.5;cursor:not-allowed}
.fab-result{margin-top:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
.fab-close{margin-top:12px;padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);cursor:pointer;font-family:var(--font);font-size:12px}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">RADAR</div>
    <div class="login-sub">inteligencia de marketing</div>
    <input type="password" class="login-input" id="apiKeyInput" placeholder="Ingresa tu API Key de Anthropic (sk-ant-...)">
    <button class="login-btn" onclick="handleLogin()">Entrar</button>
    <div class="login-hint">Consigue tu key en <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a><br>Tu key se guarda solo en tu navegador.</div>
  </div>
</div>
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-logo">RADAR</div>
    <div class="sidebar-sub">v3.0 · inteligencia</div>
    <div id="sidebarNav"></div>
    <div class="sidebar-footer"><button onclick="handleLogout()">Cerrar sesión</button></div>
  </div>
  <div class="mobile-nav" id="mobileNav"></div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="sectionTitle">⚙️ Configuración</div>

        <button class="topbar-filter" id="criticalFilter" onclick="toggleCriticalFilter()">⚡ Solo crítico</button>
        <button class="topbar-filter" id="threatFilter" onclick="toggleThreatFilter()" style="border-color:var(--red);color:var(--red)">🚨 Amenaza</button>
      </div>
    </div>
    <div class="content" id="contentArea"></div>
  </div>
</div>
<div class="modal-overlay" id="impactModal">
  <div class="modal-box">
    <div class="modal-title">¿Cómo me afecta esto?</div>
    <div class="modal-subtitle" id="impactSubtitle"></div>
    <div class="modal-content" id="impactContent"></div>
    <button class="modal-close" onclick="closeImpactModal()">Cerrar</button>
  </div>
</div>
<button class="fab" onclick="openFab()" title="Analizar PDF o texto">📄</button>
<div class="fab-modal" id="fabModal">

    <div class="fab-title">📄 Analizar documento o texto</div>
    <div class="fab-sub">Sube un PDF, pega texto o ingresa una URL para que RADAR lo analice</div>
    <input type="file" id="fabFile" accept=".pdf,.txt" style="display:none" onchange="handleFabFile(event)">
    <label for="fabFile" class="fab-file">📎 Click para subir archivo PDF o TXT</label>
    <textarea class="fab-textarea" id="fabText" placeholder="O pega aquí el texto que quieres analizar..."></textarea>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Tipo de análisis:</div>
    <div class="fab-actions" id="fabActions">
      <button class="fab-action-btn active" data-mode="resumen" onclick="setFabMode('resumen',this)">📋 Resumen</button>
      <button class="fab-action-btn" data-mode="clave" onclick="setFabMode('clave',this)">📌 Lo clave</button>
      <button class="fab-action-btn" data-mode="afecta" onclick="setFabMode('afecta',this)">🔮 ¿Cómo me afecta?</button>
      <button class="fab-action-btn" data-mode="accion" onclick="setFabMode('accion',this)">⚡ Tomar acción</button>
    </div>
    <button class="fab-submit" onclick="analyzeFab()">Analizar</button>
    <button class="fab-close" onclick="closeFab()">Cerrar</button>
    <div class="fab-result" id="fabResult" style="display:none"></div>
  </div>
</div>

eight:1.6">RADAR v3.0 — Centro de inteligencia de marketing digital<br>Haiku para búsqueda rápida · Sonnet para análisis profundo<br>Favoritos no gastan tokens · Tus datos solo en este navegador.</div></div>';

async function globalSearch(){
  const q=document.getElementById('globalSearchInput')?.value?.trim();
  if(!q)return;
  const ck='search_'+q;
  if(cache[ck]){document.getElementById('sectionTitle').textContent='🔍 '+q;renderResults(cache[ck]);return}
  document.getElementById('sectionTitle').textContent='🔍 '+q;
  currentSection='search';
  document.getElementById('contentArea').innerHTML='<div class="loading-container"><div class="radar-spinner"></div><div class="loading-text">Buscando: '+q+'</div><div class="loading-sub">15-30 segundos</div></div>';
  try{
    const text=await callClaude('Search for the most important, recent, and valuable information about: "'+q+'"\n\nFind PRIMARY sources — official announcements, original articles, documentation, expert analysis. Not summaries from third parties.\n\nReturn JSON array 5-10 items: {"id":"uid","title":"SPANISH","summary":"2-3 sentences SPANISH","source":"name","url":"url","date":"YYYY-MM-DD","urgency":"critical|informative|opportunity|threat"}\n\nPrioritize: official sources, recent dates, actionable information.','Intelligence analyst. '+TR+' Respond ONLY with valid JSON array. No markdown, no backticks.');
    const clean=text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim(),s=clean.indexOf('['),e=clean.lastIndexOf(']');
    if(s===-1||e===-1)throw new Error('No JSON');
    const data=JSON.parse(clean.substring(s,e+1));
    cache[ck]=data;
    renderResults(data);
  }catch(e){document.getElementById('contentArea').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-sub">'+e.message+'</div></div>'}
}

// === FAB (Floating PDF/Text Analyzer) ===
let fabMode='resumen';
if(typeof pdfjsLib!=='undefined'){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js'}
function openFab(){document.getElementById('fabModal').classList.add('open')}
function closeFab(){document.getElementById('fabModal').classList.remove('open');document.getElementById('fabResult').style.display='none'}
function setFabMode(mode,btn){fabMode=mode;document.querySelectorAll('#fabActions .fab-action-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
async function handleFabFile(event){
  const file=event.target.files[0];if(!file)return;
  const label=document.querySelector('label[for="fabFile"]');
  label.textContent='⏳ Procesando '+file.name+'...';
  try{
    let text='';
    if(file.type==='application/pdf'||file.name.endsWith('.pdf')){
      if(typeof pdfjsLib==='undefined'){label.textContent='❌ Error cargando lector PDF';return}
      const arrayBuffer=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const content=await page.getTextContent();
        text+=content.items.map(it=>it.str).join(' ')+'\n';
      }
    }else{text=await file.text()}
    document.getElementById('fabText').value=text.substring(0,15000);
    label.textContent='✅ '+file.name+' cargado ('+text.length+' caracteres)';
  }catch(e){label.textContent='❌ Error: '+e.message}
}
async function analyzeFab(){
  const text=document.getElementById('fabText').value.trim();
  if(!text){alert('Pega texto o sube un archivo primero');return}
  const resultDiv=document.getElementById('fabResult');
  resultDiv.style.display='block';
  resultDiv.innerHTML='<div class="loading-container" style="padding:20px 0"><div class="radar-spinner" style="width:30px;height:30px"></div><div class="loading-text">Analizando...</div></div>';
  const prompts={
    resumen:'Haz un resumen claro y conciso en español de este contenido. Estructura: puntos principales, datos clave, conclusiones.',
    clave:'Extrae lo más importante de este contenido en español. Dame: 3-5 puntos clave, dato más importante, fuente si aparece. Sé conciso.',
    afecta:'Analiza cómo este contenido afecta mi negocio en español. Mi negocio: Ecommerce COD Colombia, suplementos salud vía Meta Ads y WhatsApp. Responde con: IMPACTO DIRECTO, ACCIONES INMEDIATAS, OPORTUNIDADES, RIESGOS. Específico, sin relleno.',
    accion:'Dame un plan de acción concreto en español basado en este contenido. Mi negocio: Ecommerce COD Colombia, suplementos vía Meta Ads y WhatsApp. Responde con: ACCIÓN INMEDIATA (24h), ACCIÓN ESTA SEMANA (7 días), RESULTADO ESPERADO. Pasos específicos, listo para ejecutar.'
  };
  const deepModes=['afecta','accion'];
  try{
    const r=await callClaude(prompts[fabMode]+'\n\nCONTENIDO:\n'+text,'Analista de inteligencia. Respuesta en español. Directo y específico.',deepModes.includes(fabMode));
    resultDiv.innerHTML=r;
  }catch(e){resultDiv.innerHTML='<div style="color:var(--red)">Error: '+e.message+'</div>'}
}
