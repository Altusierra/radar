<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR — Inteligencia de Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#07070d;--bg-surface:#0f0f18;--bg-card:#161622;--bg-card-hover:#1c1c2e;--bg-input:#12121e;--accent:#00e87b;--accent-dim:#00e87b22;--accent-mid:#00e87b55;--blue:#3b82f6;--blue-dim:#3b82f622;--amber:#f59e0b;--amber-dim:#f59e0b22;--red:#ef4444;--red-dim:#ef444422;--purple:#a855f7;--purple-dim:#a855f722;--pink:#ec4899;--cyan:#06b6d4;--text:#e4e4e7;--text-secondary:#a1a1aa;--text-muted:#52525b;--border:#27273a;--border-light:#1e1e2e;--font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-base);color:var(--text);font-family:var(--font);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg-base)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* LOGIN */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#0a1a12 0%,var(--bg-base) 70%)}
.login-box{text-align:center;max-width:420px;width:90%;padding:2.5rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:16px}
.login-logo{font-size:2.5rem;font-weight:700;letter-spacing:6px;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text-muted);margin-bottom:2rem;font-family:var(--mono)}
.login-input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;margin-bottom:12px;outline:none;transition:border .2s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#07070d;border:none;border-radius:8px;font-family:var(--font);font-weight:600;font-size:14px;cursor:pointer;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-hint{font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.5}
.login-hint a{color:var(--accent);text-decoration:none}
/* APP SHELL */
.app{display:none;flex-direction:column;height:100vh}.app.active{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg-surface);flex-wrap:wrap}
.tb-logo{font-size:1.2rem;font-weight:700;letter-spacing:3px;color:var(--accent);cursor:pointer}
.tb-back{padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:var(--font)}
.tb-back:hover{border-color:var(--accent);color:var(--accent)}
.tb-title{font-size:14px;font-weight:500;color:var(--text-secondary)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-right input[type=date]{padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;color-scheme:dark}
.tb-btn{padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.tb-btn:hover{border-color:var(--accent);color:var(--accent)}
.tb-filter.active{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.content{flex:1;overflow-y:auto;padding:24px 20px;max-width:1100px;width:100%;margin:0 auto}
/* HOME */
.home-hero{text-align:center;margin:10px 0 26px}
.home-hero .hl{font-size:2.2rem;font-weight:700;letter-spacing:6px;color:var(--accent)}
.home-hero .hs{font-size:13px;color:var(--text-muted);font-family:var(--mono);margin-top:2px}
.home-search{display:flex;gap:8px;max-width:680px;margin:0 auto 8px}
.home-search input{flex:1;padding:14px 18px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:var(--font);outline:none}
.home-search input:focus{border-color:var(--accent)}
.home-search button{padding:14px 22px;background:var(--accent);color:var(--bg-base);border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.home-tip{text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:24px;font-family:var(--mono)}
.home-tip b{color:var(--accent);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bigbtn{display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .18s;text-align:left}
.bigbtn:hover{border-color:var(--accent);background:var(--bg-card-hover);transform:translateY(-1px)}
.bigbtn .ic{font-size:26px;width:34px;text-align:center;flex-shrink:0}
.bigbtn .tt{font-size:15px;font-weight:600;color:var(--text)}
.bigbtn .ds{font-size:12px;color:var(--text-muted);margin-top:2px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin:26px 0 10px}
.util-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.utilbtn{display:flex;align-items:center;gap:10px;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;font-size:13px;color:var(--text-secondary)}
.utilbtn:hover{border-color:var(--accent);color:var(--text)}
.utilbtn .ic{font-size:18px}
/* CHIP PANEL */
.panel-head{margin-bottom:16px}
.panel-head .pt{font-size:20px;font-weight:600;color:var(--text)}
.panel-head .pd{font-size:13px;color:var(--text-secondary);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:24px;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all .15s;font-family:var(--font)}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.chip.discover{border-color:var(--purple);color:var(--purple)}
.chip.discover:hover{background:var(--purple-dim)}
/* CARDS */
.cards-grid{display:flex;flex-direction:column;gap:12px}
.news-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;padding:16px 20px;transition:all .2s;position:relative}
.news-card:hover{border-color:var(--border);background:var(--bg-card-hover)}
.news-card.read{opacity:.55}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card-badge{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px;font-weight:500}
.badge-critical{background:var(--red-dim);color:var(--red)}.badge-informative{background:var(--blue-dim);color:var(--blue)}.badge-opportunity{background:var(--accent-dim);color:var(--accent)}.badge-threat{background:var(--amber-dim);color:var(--amber)}
.origin-badge{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:4px;font-weight:500}
.origin-original{background:#00e87b22;color:#00e87b;border:1px solid #00e87b55}
.origin-replica{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b55}
.origin-aggregator{background:#ef444422;color:#ef4444;border:1px solid #ef444455;opacity:.85}
.news-card.is-aggregator{opacity:.6}
.origin-link{font-size:10px;color:var(--text-muted);margin-top:6px;font-family:var(--mono)}
.origin-link a{color:var(--accent);text-decoration:none}
.card-source{font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.card-date{font-size:11px;color:var(--text-muted);margin-left:auto;font-family:var(--mono)}
.card-title{font-size:15px;font-weight:500;line-height:1.4;margin-bottom:6px;color:var(--text)}
.card-summary{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}
.card-btn{padding:5px 12px;font-size:11px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-secondary);font-family:var(--font);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center}
.card-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-btn.favorited{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.card-btn.link-btn{border-color:var(--blue);color:var(--blue)}
.card-btn.impact-btn{border-color:var(--purple);color:var(--purple)}
.card-note{margin-top:10px;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;display:none}
.card-note.open{display:block}
.card-note textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:12px;font-family:var(--font);resize:vertical;min-height:50px;outline:none}
.card-note .note-save{margin-top:6px;padding:4px 10px;background:var(--accent);color:var(--bg-base);border:none;border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--font);font-weight:500}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;max-width:600px;width:90%;max-height:82vh;overflow-y:auto;padding:24px}
.modal-title{font-size:16px;font-weight:600;color:var(--purple);margin-bottom:4px}
.modal-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.modal-content{font-size:13px;color:var(--text-secondary);line-height:1.7}
.modal-close{margin-top:16px;padding:8px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);cursor:pointer;font-family:var(--font);font-size:13px}
.chat-area{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto;padding:8px 0;margin-bottom:12px}
.chat-msg{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;max-width:90%;white-space:pre-wrap;word-wrap:break-word}
.chat-msg-assistant{background:var(--bg-card);color:var(--text);align-self:flex-start;border:1px solid var(--border-light)}
.chat-msg-user{background:var(--amber-dim);color:var(--text);align-self:flex-end;border:1px solid var(--amber);max-width:80%}
.chat-input-row{display:flex;gap:6px;margin-top:6px}
.chat-input{flex:1;padding:10px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;resize:none;min-height:38px;max-height:100px}
.chat-input:focus{border-color:var(--amber)}
.chat-send{padding:8px 16px;background:var(--amber);color:var(--bg-base);border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--font)}
.chat-loading{padding:8px 14px;color:var(--text-muted);font-size:12px;font-style:italic}
/* LOADING / EMPTY */
.loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0}
.radar-spinner{width:54px;height:54px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text-muted);font-family:var(--mono)}
.loading-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:500;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--text-muted);max-width:400px;margin:0 auto;line-height:1.6}
.digest-box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:10px;padding:20px;margin-bottom:16px}
.digest-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px}
.digest-content{font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
.digest-copy{margin-top:12px;padding:6px 14px;background:var(--accent-dim);border:1px solid var(--accent-mid);border-radius:6px;color:var(--accent);font-size:12px;cursor:pointer;font-family:var(--mono)}
/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--bg-base);border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,232,123,0.4);z-index:90;transition:transform .2s}
.fab:hover{transform:scale(1.05)}
.fab-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.fab-modal.open{display:flex}
.fab-box{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;max-width:700px;width:90%;max-height:85vh;overflow-y:auto;padding:24px}
.fab-title{font-size:18px;font-weight:600;color:var(--accent);margin-bottom:4px}
.fab-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.fab-textarea{width:100%;min-height:130px;padding:12px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;resize:vertical;margin-bottom:12px}
.fab-file{display:block;padding:10px;background:var(--bg-input);border:1px dashed var(--border);border-radius:8px;color:var(--text-secondary);font-size:12px;margin-bottom:12px;cursor:pointer;text-align:center}
.fab-file:hover{border-color:var(--accent);color:var(--accent)}
.fab-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fab-action-btn{padding:8px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:var(--font)}
.fab-action-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.fab-submit{padding:10px 20px;background:var(--accent);color:var(--bg-base);border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--font)}
.fab-result{margin-top:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-secondary);line-height:1.7;white-space:pre-wrap}
.fab-close{margin-top:12px;padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-secondary);cursor:pointer;font-family:var(--font);font-size:12px}
.settings-section{margin-bottom:24px}
.settings-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--accent)}
@media(max-width:600px){.content{padding:16px 14px}.home-hero .hl{font-size:1.8rem}}
</style>
</head>
<body>
<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">RADAR</div>
    <div class="login-sub">inteligencia de marketing · simple</div>
    <input type="password" class="login-input" id="apiKeyInput" placeholder="Ingresa tu API Key de Anthropic (sk-ant-...)" onkeydown="if(event.key==='Enter')handleLogin()">
    <button class="login-btn" onclick="handleLogin()">Entrar</button>
    <div class="login-hint">Consigue tu key en <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a><br>Tu key se guarda solo en tu navegador.</div>
  </div>
</div>
<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="tb-logo" onclick="goHome()">RADAR</div>
    <button class="tb-back" id="backBtn" onclick="goHome()" style="display:none">← Inicio</button>
    <span class="tb-title" id="tbTitle"></span>
    <div class="tb-right" id="tbRight" style="display:none">
      <input type="date" id="dateInput" title="Buscar contenido de esta fecha">
      <button class="tb-btn" id="refreshBtn" onclick="refreshCurrent()">↻ Actualizar</button>
      <button class="tb-btn tb-filter" id="criticalFilter" onclick="toggleFilter('critical')">⚡ Crítico</button>
      <button class="tb-btn tb-filter" id="threatFilter" onclick="toggleFilter('threat')">🚨 Amenaza</button>
      <button class="tb-btn tb-filter" id="originFilter" onclick="toggleFilter('origin')">🎯 Origen</button>
    </div>
  </div>
  <div class="content" id="contentArea"></div>
</div>
<!-- IMPACT / ACTION MODAL -->
<div class="modal-overlay" id="impactModal">
  <div class="modal-box">
    <div class="modal-title" id="impactTitle">¿Cómo me afecta esto?</div>
    <div class="modal-subtitle" id="impactSubtitle"></div>
    <div class="modal-content" id="impactContent"></div>
    <button class="modal-close" onclick="closeImpactModal()">Cerrar</button>
  </div>
</div>
<!-- FAB -->
<button class="fab" onclick="openFab()" title="Analizar PDF o texto">📄</button>
<div class="fab-modal" id="fabModal">
  <div class="fab-box">
    <div class="fab-title">📄 Analizar documento o texto</div>
    <div class="fab-sub">Sube un PDF, pega texto o la página de un competidor para que RADAR lo analice</div>
    <input type="file" id="fabFile" accept=".pdf,.txt" style="display:none" onchange="handleFabFile(event)">
    <label for="fabFile" class="fab-file">📎 Click para subir archivo PDF o TXT</label>
    <textarea class="fab-textarea" id="fabText" placeholder="O pega aquí el texto que quieres analizar..."></textarea>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Tipo de análisis:</div>
    <div class="fab-actions" id="fabActions">
      <button class="fab-action-btn active" data-mode="resumen" onclick="setFabMode('resumen',this)">📋 Resumen</button>
      <button class="fab-action-btn" data-mode="clave" onclick="setFabMode('clave',this)">📌 Lo clave</button>
      <button class="fab-action-btn" data-mode="afecta" onclick="setFabMode('afecta',this)">🔮 ¿Cómo me afecta?</button>
      <button class="fab-action-btn" data-mode="accion" onclick="setFabMode('accion',this)">⚡ Tomar acción</button>
    </div>
    <button class="fab-submit" onclick="analyzeFab()">Analizar</button>
    <button class="fab-close" onclick="closeFab()">Cerrar</button>
    <div class="fab-result" id="fabResult" style="display:none"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<script>
/* ============ ESTADO ============ */
let API_KEY='';
let cache={},itemStore={};
let filters={critical:false,threat:false,origin:false};
let currentView={type:'home'};
let favorites=JSON.parse(localStorage.getItem('radar_favs')||'{}');
let readItems=JSON.parse(localStorage.getItem('radar_read')||'{}');
let notes=JSON.parse(localStorage.getItem('radar_notes')||'{}');
const BIZ='Mi negocio: Ecommerce COD en Colombia/LATAM, suplementos de salud vendidos por Meta Ads y WhatsApp (Dropi, ENVÍA/Interrapidísimo).';
const TR='CRITICAL: ALL titles and summaries MUST be in Spanish. Translate everything from any language to Spanish. Keep original URLs.';
const ORIGIN_RULE='For EACH item add JSON fields: "origin" = "original" if this source is the first to publish, "replica" if it cites an earlier source, or "aggregator" if it is a summary/listicle. If replica/aggregator, add "origin_source" and "origin_url" when known. Older date = closer to origin.';
const SYS='Marketing intelligence analyst. '+TR+' '+ORIGIN_RULE+' Respond ONLY with a valid JSON array. No markdown, no backticks.';

/* ============ BOTONES GRANDES (acciones rápidas) ============ */
const QUICK={
  nuevo:{icon:'🔥',title:'Lo nuevo de hoy',desc:'lo más grande en marketing e IA',deep:true,
    prompt:'Find the BIGGEST and NEWEST launches, announcements and updates from the last 10 days across digital advertising (Meta/Facebook/Instagram Ads, TikTok Ads, Google Ads), ecommerce/Shopify, and especially AI tools and AI models for marketing, video, image generation and copywriting. Include new AI models, new ad features and new tools (e.g. new releases from OpenAI/ChatGPT, Google/Gemini, etc.). For each item explain what it is and why it matters. ORDER the array from most important/disruptive to least.'},
  ia:{icon:'🤖',title:'Herramientas IA nuevas',desc:'lo último para probar ya',deep:false,
    prompt:'Find the NEWEST AI tools and AI model releases from recent weeks that are useful for marketing, ecommerce, paid ads, video creation, image generation, voice and copywriting. For each: what it does, why it is new or better, and a link to try it. Include big launches and notable smaller tools. ORDER from most important to least.'},
  copy:{icon:'✍️',title:'Copy que funciona',desc:'hooks, frameworks, ganadores',panel:'copy'},
  meta:{icon:'📘',title:'Meta Ads',desc:'todas las estrategias de trafficker',panel:'meta'},
  tiktok:{icon:'🎵',title:'TikTok Ads',desc:'algoritmo, spark, creators',panel:'tiktok'},
  google:{icon:'🔍',title:'Google Ads',desc:'PMax, search, shopping',panel:'google'},
  baneos:{icon:'🛡️',title:'Baneos y rescate',desc:'protege y recupera cuentas',panel:'baneos'},
  tendencias:{icon:'📈',title:'Lo que está subiendo',desc:'tendencias del momento',deep:true,
    prompt:'Identify what is ACCELERATING right now in digital marketing, paid ads and ecommerce: rising techniques, tools and trends gaining momentum, and also what is declining. Explain why each is moving now and what to do about it. '+BIZ}
};
const QUICK_ORDER=['nuevo','ia','meta','tiktok','google','copy','baneos','tendencias'];

function runQuick(id){

function renderPanel(pid){

  currentView={type:'panel',pid};setTopbar('panel',p.title.replace(/^[^ ]+ /,''));

  p.chips.forEach((ch,i)=>{chips+='<div class="chip'+(ch.discover?' discover':'')+'" onclick="runChip(\''+pid+'\','+i+')">'+ch.l+'</div>';});

    '<div class="chips">'+chips+'</div>';

function runChip(pid,i){
  const ch=PANELS[pid].chips[i];
  runSearch(ch.q,PANELS[pid].title.replace(/^[^ ]+ /,'')+' · '+ch.l.replace('🔍 ',''),{discover:!!ch.discover});
}
function runFreeSearch(){
  const q=document.getElementById('homeSearch')?.value?.trim();
  if(!q)return;
  runSearch(q,'🔍 '+q,{free:true});
}

/* ============ BÚSQUEDA (motor) ============ */
function dateCtx(){const d=document.getElementById('dateInput')?.value;return d?'Focus on news around '+d+'.':'Focus on the most recent information.';}
function buildPrompt(query,opts){
  const shape='\n\nReturn a JSON array of 6-10 items: {"id":"uid","title":"SPANISH","summary":"2-3 sentences in SPANISH","source":"name","url":"url","date":"YYYY-MM-DD","urgency":"critical|informative|opportunity|threat"}\nPrioritize official/primary sources, recent dates and specific, actionable info. Be concrete: real names, numbers and tools.';
  if(opts.special){return query+' '+dateCtx()+shape;}
  if(opts.discover){return 'Find non-obvious, advanced or little-known information about: '+query+'. Surface what most marketers miss. '+dateCtx()+' '+BIZ+shape;}
  if(opts.free){return 'Search for the most important, recent and valuable information about: "'+query+'". Find PRIMARY sources, not third-party summaries. '+dateCtx()+shape;}
  return 'Search the latest and most valuable information about: '+query+'. '+dateCtx()+' Context: '+BIZ+shape;
}
async function runSearch(query,title,opts){
  opts=opts||{};
  const ck='q_'+(document.getElementById('dateInput')?.value||'')+'_'+query;
  currentView={type:'results',query,title,opts,ck};
  setTopbar('results',title);
  if(cache[ck]){renderResults(cache[ck]);return;}
  showLoading(title);
  try{
    const text=await callClaude(buildPrompt(query,opts),SYS,!!opts.deep);
    const data=parseItems(text);
    cache[ck]=data;
    renderResults(data);
  }catch(e){
    document.getElementById('contentArea').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error al cargar</div><div class="empty-sub">'+e.message+'</div></div>';
  }
}
function parseItems(text){
  const c=text.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
  const s=c.indexOf('['),e=c.lastIndexOf(']');
  if(s===-1||e===-1)throw new Error('No se pudo leer la respuesta. Intenta de nuevo.');
  return JSON.parse(c.substring(s,e+1));
}
async function callClaude(p,sys,deep){
  const m=deep?'claude-sonnet-4-5':'claude-haiku-4-5-20251001';
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:4096,system:sys,tools:[{type:'web_search_20250305',name:'web_search',max_uses:3}],messages:[{role:'user',content:p}]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'Error '+r.status)}
  const d=await r.json();let t='';for(const b of d.content){if(b.type==='text')t+=b.text}return t;
}

/* ============ RENDER RESULTADOS / TARJETAS ============ */
function showLoading(title){document.getElementById('contentArea').innerHTML='<div class="loading-container"><div class="radar-spinner"></div><div class="loading-text">Buscando: '+title+'</div><div class="loading-sub">15-30 segundos · gasta 1 búsqueda</div></div>'}
function renderResults(items){
  const c=document.getElementById('contentArea');
  if(!items||!items.length){c.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Sin resultados</div><div class="empty-sub">Prueba otra fecha o toca Actualizar.</div></div>';return}
  let f=items.slice();
  if(filters.origin){f=f.filter(i=>i.origin==='original');if(!f.length)return emptyFilter(c,'🎯','Sin fuentes originales','No se identificaron fuentes originales. Desactiva el filtro.');}
  if(filters.threat){f=f.filter(i=>i.urgency==='threat');if(!f.length)return emptyFilter(c,'✅','Sin amenazas','No hay amenazas directas. Desactiva el filtro.');}
  if(filters.critical){f=f.filter(i=>i.urgency==='critical'||i.urgency==='threat');if(!f.length)return emptyFilter(c,'✅','Sin alertas críticas','Todo tranquilo. Desactiva el filtro.');}
  c.innerHTML='<div class="cards-grid">'+f.map(renderCard).join('')+'</div>';
}
function emptyFilter(c,ic,t,s){c.innerHTML='<div class="empty-state"><div class="empty-icon">'+ic+'</div><div class="empty-title">'+t+'</div><div class="empty-sub">'+s+'</div></div>';}
function renderCard(item){
  const id=item.id||Math.random().toString(36).substr(2,9);item.id=id;itemStore[id]=item;
  const isRead=readItems[id],isFav=favorites[id],note=notes[id]||'';
  const uc={critical:'badge-critical',informative:'badge-informative',opportunity:'badge-opportunity',threat:'badge-threat'}[item.urgency]||'badge-informative';
  const ul={critical:'🔥 CRÍTICO',informative:'INFO',opportunity:'🟢 OPORTUNIDAD',threat:'🚨 AMENAZA'}[item.urgency]||'INFO';
  const src=item.source||item.channel||item.author||'',url=item.url||'#';
  const oc={original:'origin-original',replica:'origin-replica',aggregator:'origin-aggregator'}[item.origin];
  const ol={original:'🟢 ORIGEN',replica:'🟡 RÉPLICA',aggregator:'🔴 ECO'}[item.origin];
  const originBadge=oc?'<span class="origin-badge '+oc+'">'+ol+'</span>':'';
  const cardClass=item.origin==='aggregator'?'is-aggregator':'';
  const originLink=(item.origin==='replica'&&item.origin_url)?'<div class="origin-link">↳ Original: <a href="'+item.origin_url+'" target="_blank">'+(item.origin_source||'fuente original')+'</a></div>':'';
  return '<div class="news-card '+(isRead?'read':'')+' '+cardClass+'" id="card-'+id+'">'+
    '<div class="card-top"><span class="card-badge '+uc+'">'+ul+'</span>'+originBadge+'<span class="card-source">'+src+'</span><span class="card-date">'+(item.date||'')+'</span></div>'+
    '<div class="card-title">'+(item.title||'')+'</div>'+
    '<div class="card-summary">'+(item.summary||'')+'</div>'+
    originLink+
    '<div class="card-actions">'+
      (url!=='#'?'<a href="'+url+'" target="_blank" class="card-btn link-btn">🔗 Ver fuente</a>':'')+
      '<button class="card-btn '+(isFav?'favorited':'')+'" onclick="toggleFav(\''+id+'\',this)">'+(isFav?'★ Guardado':'☆ Guardar')+'</button>'+
      '<button class="card-btn" onclick="toggleRead(\''+id+'\',this)">'+(isRead?'◉ No leído':'◎ Leído')+'</button>'+
      '<button class="card-btn" onclick="toggleNote(\''+id+'\')">📝 Nota</button>'+
      '<button class="card-btn impact-btn" onclick="analyzeImpact(\''+id+'\')">🔮 ¿Cómo me afecta?</button>'+
      '<button class="card-btn" style="border-color:var(--cyan);color:var(--cyan)" onclick="extractKey(\''+id+'\')">📌 Lo clave</button>'+
      '<button class="card-btn" style="border-color:var(--amber);color:var(--amber)" onclick="takeAction(\''+id+'\')">⚡ Tomar acción</button>'+
    '</div>'+
    '<div class="card-note" id="note-'+id+'"><textarea placeholder="Escribe tu nota..." id="notetext-'+id+'">'+note+'</textarea><button class="note-save" onclick="saveNote(\''+id+'\')">Guardar nota</button></div>'+
    '<div class="card-note" id="key-'+id+'" style="display:none;border-color:var(--cyan)"><div id="keytext-'+id+'" style="font-size:12px;color:var(--text-secondary);line-height:1.6"></div></div>'+
  '</div>';
}

  catch(e){const a=document.getElementById('chatArea');if(a)a.innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-sub">'+e.message+'</div></div>'}
}
function renderChat(){const area=document.getElementById('chatArea');if(!area)return;let html='';for(let i=0;i<actionChat.messages.length;i++){const m=actionChat.messages[i];if(i===0&&m.role==='user')continue;html+='<div class="chat-msg '+(m.role==='user'?'chat-msg-user':'chat-msg-assistant')+'">'+m.content+'</div>'}area.innerHTML=html;area.scrollTop=area.scrollHeight}
async function sendActionChat(){
  const input=document.getElementById('chatInput');if(!input)return;const text=input.value.trim();if(!text)return;input.value='';
  actionChat.messages.push({role:'user',content:text});renderChat();
  const area=document.getElementById('chatArea');area.innerHTML+='<div class="chat-loading" id="chatLoading">⏳ Pensando...</div>';area.scrollTop=area.scrollHeight;
  try{const r=await callClaudeChat(actionChat.messages,'Action-oriented strategic advisor for COD ecommerce Colombia (supplements via Meta Ads + WhatsApp). Spanish. Concrete and actionable. News context: '+actionChat.context);actionChat.messages.push({role:'assistant',content:r});renderChat()}
  catch(e){const l=document.getElementById('chatLoading');if(l)l.remove();actionChat.messages.push({role:'assistant',content:'⚠️ Error: '+e.message});renderChat()}
}
async function callClaudeChat(messages,sys){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:2048,system:sys,messages})});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'Error '+res.status)}
  const data=await res.json();let t='';for(const b of data.content){if(b.type==='text')t+=b.text}return t;
}

  if(v==='aprende'){currentView={type:'aprende'};setTopbar('aprende','🎓 Aprende algo');return renderAprende()}
  if(v==='config'){currentView={type:'config'};setTopbar('config','⚙️ Ajustes');return renderConfig()}
}
function renderFavorites(){
  const c=document.getElementById('contentArea'),fl=Object.values(favorites);
  if(!fl.length){c.innerHTML='<div class="empty-state"><div class="empty-icon">⭐</div><div class="empty-title">Sin guardados</div><div class="empty-sub">Guarda noticias o herramientas con ☆. Los guardados no gastan tokens.</div></div>';return}
  fl.forEach(item=>{if(item.id)itemStore[item.id]=item});
  c.innerHTML='<div class="cards-grid">'+fl.map(renderCard).join('')+'</div>';
}
async function generateDigest(){
  showLoading('Digest semanal');
  try{const r=await callClaude('Weekly marketing digest of the past 7 days: Meta Ads, TikTok Ads, Google Ads, Shopify, ecommerce, copywriting, AI tools, Meta account security, WhatsApp Business.\n\nIn Spanish:\n🔴 ALERTAS CRÍTICAS\n🟡 ACTUALIZACIONES IMPORTANTES\n🟢 OPORTUNIDADES\n🎯 ACCIÓN DE LA SEMANA\n📊 TERMÓMETRO DEL ECOSISTEMA\n\n'+BIZ+' Specific.','Marketing analyst. Spanish. Actionable.',true);
  document.getElementById('contentArea').innerHTML='<div class="digest-box"><div class="digest-title">Digest semanal — '+new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})+'</div><div class="digest-content">'+r+'</div><button class="digest-copy" onclick="copyDigest()">📋 Copiar</button></div>'}
  catch(e){document.getElementById('contentArea').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-sub">'+e.message+'</div></div>'}
}
function copyDigest(){const t=document.querySelector('.digest-content');if(!t)return;navigator.clipboard.writeText(t.textContent||'').then(()=>{const b=document.querySelector('.digest-copy');b.textContent='✅ Copiado';setTimeout(()=>b.textContent='📋 Copiar',2000)})}

let learnChat={messages:[],topic:''};
function renderAprende(){
  document.getElementById('contentArea').innerHTML='<div class="panel-head"><div class="pt">🎓 Aprende algo nuevo</div><div class="pd">Dime qué quieres entender y te lo explico paso a paso, fácil, con ejemplos de tu negocio.</div></div>'+
    '<div class="home-search" style="margin-bottom:14px"><input type="text" id="learnTopic" placeholder="¿Qué quieres aprender? (ej: CBO, CAPI, Performance Max, VSL)" onkeydown="if(event.key===\'Enter\')startLearn()"><button onclick="startLearn()">Empezar</button></div>'+
    '<div class="chat-area" id="learnArea" style="max-height:520px"></div>'+
    '<div class="chat-input-row" id="learnRow" style="display:none"><textarea class="chat-input" id="learnInput" placeholder="Pregunta o pide más detalle..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendLearn()}"></textarea><button class="chat-send" onclick="sendLearn()">Enviar</button></div>';
}
async function startLearn(){
  const topic=document.getElementById('learnTopic')?.value?.trim();if(!topic)return;
  learnChat={messages:[],topic};document.getElementById('learnRow').style.display='flex';
  document.getElementById('learnArea').innerHTML='<div class="chat-loading">⏳ Preparando tu lección...</div>';
  const prompt='Quiero aprender: "'+topic+'"\n\n'+BIZ+'\n\nEnséñame paso a paso, asumiendo que sé poco. Estructura:\n1. ¿QUÉ ES? (simple)\n2. ¿POR QUÉ ME IMPORTA?\n3. PASO A PASO\n4. EJEMPLO con mi negocio\n5. ERRORES COMUNES\n6. PRÓXIMO PASO HOY\n\nEspañol claro, sin jerga.';
  learnChat.messages.push({role:'user',content:prompt});
  try{const r=await callClaudeChat(learnChat.messages,'Expert teacher of digital marketing and ecommerce. Student: COD entrepreneur in Colombia (supplements via Meta + WhatsApp). Pedagogical, concrete examples, no jargon. Spanish. Topic: '+topic);learnChat.messages.push({role:'assistant',content:r});renderLearn()}
  catch(e){document.getElementById('learnArea').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error</div><div class="empty-sub">'+e.message+'</div></div>'}
}
async function sendLearn(){
  const input=document.getElementById('learnInput');const t=input?.value?.trim();if(!t)return;input.value='';
  learnChat.messages.push({role:'user',content:t});renderLearn();
  const area=document.getElementById('learnArea');area.innerHTML+='<div class="chat-loading" id="learnLoading">⏳ Pensando...</div>';area.scrollTop=area.scrollHeight;
  try{const r=await callClaudeChat(learnChat.messages,'Expert teacher of digital marketing and ecommerce. Student: COD entrepreneur in Colombia. Pedagogical, concrete, no jargon. Spanish. Topic: '+learnChat.topic);learnChat.messages.push({role:'assistant',content:r});renderLearn()}
  catch(e){const l=document.getElementById('learnLoading');if(l)l.remove();learnChat.messages.push({role:'assistant',content:'⚠️ Error: '+e.message});renderLearn()}
}
function renderLearn(){const area=document.getElementById('learnArea');if(!area)return;let html='';for(let i=0;i<learnChat.messages.length;i++){const m=learnChat.messages[i];if(i===0&&m.role==='user')continue;html+='<div class="chat-msg '+(m.role==='user'?'chat-msg-user':'chat-msg-assistant')+'">'+m.content+'</div>'}area.innerHTML=html;area.scrollTop=area.scrollHeight}

function renderConfig(){
  document.getElementById('contentArea').innerHTML=
    '<div class="panel-head"><div class="pt">⚙️ Ajustes</div><div class="pd">Tu llave y tus datos. Todo vive solo en este navegador.</div></div>'+
    '<div class="settings-section"><div class="settings-title">Cómo ahorras tokens</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.7">• Nada se busca solo: solo gasta cuando tú tocas un botón o buscas.<br>• Cada búsqueda se guarda en memoria: si la repites el mismo día, no vuelve a gastar.<br>• Tus guardados, notas y lecturas no gastan nada.<br>• Búsqueda rápida usa Haiku (barato). Análisis profundo usa Sonnet.</div></div>'+
    '<div class="settings-section"><div class="settings-title">Datos locales</div><button class="card-btn" style="border-color:var(--red);color:var(--red)" onclick="clearAllData()">🗑 Borrar guardados, notas y caché</button><div style="font-size:11px;color:var(--text-muted);margin-top:6px">Tu API key NO se borra con esto.</div></div>'+
    '<div class="settings-section"><div class="settings-title">Sesión</div><button class="card-btn" onclick="handleLogout()">Cerrar sesión (olvidar API key)</button></div>'+
    '<div class="settings-section"><div class="settings-title">Acerca de</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.6">RADAR · versión simple<br>Tu radar de marketing e IA. Sin menús eternos.</div></div>';
}
function clearAllData(){if(!confirm('¿Borrar guardados, notas y caché?'))return;favorites={};readItems={};notes={};cache={};localStorage.removeItem('radar_favs');localStorage.removeItem('radar_read');localStorage.removeItem('radar_notes');alert('Datos borrados');goHome()}

/* ============ FAB (analizar PDF / texto) ============ */
let fabMode='resumen';
if(typeof pdfjsLib!=='undefined'){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js'}
function openFab(){document.getElementById('fabModal').classList.add('open')}
function closeFab(){document.getElementById('fabModal').classList.remove('open');document.getElementById('fabResult').style.display='none'}
function setFabMode(mode,btn){fabMode=mode;document.querySelectorAll('#fabActions .fab-action-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
async function handleFabFile(event){
  const file=event.target.files[0];if(!file)return;
  const label=document.querySelector('label[for="fabFile"]');label.textContent='⏳ Procesando '+file.name+'...';
  try{
    let text='';
    if(file.type==='application/pdf'||file.name.endsWith('.pdf')){
      if(typeof pdfjsLib==='undefined'){label.textContent='❌ Error cargando lector PDF';return}
      const arrayBuffer=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
      for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const content=await page.getTextContent();text+=content.items.map(it=>it.str).join(' ')+'\n'}
    }else{text=await file.text()}
    document.getElementById('fabText').value=text.substring(0,15000);
    label.textContent='✅ '+file.name+' cargado ('+text.length+' caracteres)';
  }catch(e){label.textContent='❌ Error: '+e.message}
}
async function analyzeFab(){
  const text=document.getElementById('fabText').value.trim();
  if(!text){alert('Pega texto o sube un archivo primero');return}
  const resultDiv=document.getElementById('fabResult');resultDiv.style.display='block';
  resultDiv.innerHTML='<div class="loading-container" style="padding:20px 0"><div class="radar-spinner" style="width:30px;height:30px"></div><div class="loading-text">Analizando...</div></div>';
  const prompts={
    resumen:'Haz un resumen claro y conciso en español. Estructura: puntos principales, datos clave, conclusiones.',
    clave:'Extrae lo más importante en español: 3-5 puntos clave, el dato más importante, la fuente si aparece. Conciso.',
    afecta:'Analiza cómo este contenido afecta mi negocio en español. '+BIZ+' Responde: IMPACTO DIRECTO, ACCIONES INMEDIATAS, OPORTUNIDADES, RIESGOS. Específico.',
    accion:'Dame un plan de acción concreto en español basado en este contenido. '+BIZ+' Responde: ACCIÓN INMEDIATA (24h), ESTA SEMANA (7 días), RESULTADO ESPERADO. Pasos listos para ejecutar.'
  };
  const deepModes=['afecta','accion'];
  try{const r=await callClaude(prompts[fabMode]+'\n\nCONTENIDO:\n'+text,'Intelligence analyst. Spanish. Direct and specific.',deepModes.includes(fabMode));resultDiv.innerHTML='<div style="white-space:pre-wrap">'+r+'</div>'}
  catch(e){resultDiv.innerHTML='<div style="color:var(--red)">Error: '+e.message+'</div>'}
}
</script>
